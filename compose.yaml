services:
  db:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: gold_order
      MYSQL_USER: gold_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-local_only_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_only_root_password}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gold_order
      DB_USERNAME: gold_app
      DB_PASSWORD: ${DB_PASSWORD:-local_only_password}

    volumes:
      - backend_runtime:/runtime

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  api:
    image: nginx:stable-alpine

    ports:
      - "8000:80"

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api-app/public:/var/www/html/public:ro

    depends_on:
      backend:
        condition: service_started

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/healthz
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile

    environment:
      API_INTERNAL_URL: http://api
      NODE_ENV: production

    ports:
      - "3000:3000"

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

volumes:
  mysql_data:
  backend_runtime: